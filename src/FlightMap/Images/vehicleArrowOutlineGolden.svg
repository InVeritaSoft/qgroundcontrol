<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" id="Layer_1" x="0" y="0" version="1.1" viewBox="0 0 72 72">
    <defs>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffff00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge> 
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="shadow">
            <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>
    <style>
        .st1{fill:url(#goldGradient);filter:url(#shadow)}
        .st2{fill:#ffd700;filter:url(#glow)}
        .st3{fill:#ffff00;filter:url(#glow)}
    </style>
    <!-- Main vehicle body with gradient and glow -->
    <path d="M35.5 2.118v51.573L1.118 70.882z" class="st2"/>
    <path d="M35 4.236v49.146L2.236 69.764zM36 0 0 72l36-18z" class="st1"/>
    <path d="M36.5 53.691V2.118l34.382 68.764z" class="st3"/>
    <path d="m37 4.236 32.764 65.528L37 53.382zM36 0v54l36 18z" class="st1"/>
    <!-- Special ID 1 indicator -->
    <circle cx="36" cy="36" r="8" fill="#ff0000" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <text x="36" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
</svg>
