version: '3.8'

services:
  # Simple SITL Copter using Python MAVLink simulation
  sitl-copter:
    image: python:3.9-slim
    container_name: qgc-sitl-copter
    ports:
      - "14550:14550/udp"  # MAVLink UDP
      - "14551:14551/udp"  # MAVLink UDP (secondary)
    environment:
      - VEHICLE_TYPE=copter
      - FRAME_TYPE=quad
      - INSTANCE=0
      - SIM_GPS_LAT=47.397742
      - SIM_GPS_LON=8.545594
      - SIM_GPS_ALT=488
      - SIM_SPEEDUP=1
    volumes:
      - ./configs:/configs:ro
      - ./logs:/logs
      - ./missions:/missions:ro
      - ./scripts:/app/scripts:ro
    working_dir: /app
    command: >
      bash -c "
        pip install pymavlink pyserial &&
        python scripts/simple_sitl.py --vehicle=copter --port=14550
      "
    restart: unless-stopped
    networks:
      - qgc-network

